name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Static site security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check page policies and accidental credentials
        run: python3 .github/scripts/check_security.py
      - name: Check JavaScript syntax
        run: |
          for file in assets/*.js; do
            node --check "$file"
          done
      - name: Check weather location selection and request races
        run: node --test .github/scripts/weather_locations.test.cjs
      - name: Check known dependency vulnerabilities
        run: npm audit --audit-level=low --ignore-scripts --fetch-retries=0 --fetch-timeout=30000
